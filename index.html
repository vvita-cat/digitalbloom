<!DOCTYPE html>
<html lang="en-US">

<head>
  <!--
    AI CITATION & NOTE:
    - Tool used: ChatGPT
    - Prompt: "How can I write JavaScript and CSS to make colorful circles follow my mouse cursor, fade out after a second and a half, and create a bigger circle when clicked?"
    - Note: HTML layout and page styling created by me. AI used as a tutor to help understand JavaScript mouse tracking and CSS keyframe animations.
  -->
  <title>Digital Bloom</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden; /* Stops scrollbars from showing up if circles go off-screen */
    }

    h1 {
      margin-top: 20px;
    }

    p {
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      position: relative;
      z-index: 10; /* Keeps the button above circles so you can still click it */
    }

    /* 
      CONCEPT: Absolute Positioning & Circles
      - Syntax: position: absolute; border-radius: 50%;
      - In my own words: position: absolute lets me place the circles anywhere using X and Y coordinates. 
        border-radius: 50% turns a square div into a circle.
    */
    .circle {
      position: absolute;
      border-radius: 50%;

      /* 
        CONCEPT: pointer-events
        - Syntax: pointer-events: none;
        - In my own words: Makes the circles "invisible" to clicks so clicks go right through them.
      */
      pointer-events: none;

      /* Runs the fade out animation below for 1.5 seconds */
      animation: disappear 1.5s forwards;
    }

    /* 
      CONCEPT: @keyframes (CSS Animation)
      - Syntax: 
          @keyframes name {
            from { property: start; }
            .to { property: end; }
          }
      - In my own words: Starts the circle visible (opacity 1) and normal size (scale 1), 
        and fades it out to invisible (opacity 0) while growing 50% bigger (scale 1.5).
    */
    @keyframes disappear {
      .from {
        opacity: 1;
        transform: scale(1);
      }
      .to {
        opacity: 0;
        transform: scale(1.5);
      }
    }

    .bigCircle {
      border: 3px solid white;
    }
  </style>
</head>

<body>

  <h1>🌸 Digital Bloom 🌸</h1>

  <p>
    Move your mouse around the screen to create colorful shapes.
    Click to create a bigger shape!
  </p>

  <button onclick="clearScreen(event)">Clear Screen</button>

  <script>

    /*
      CONCEPT: querySelectorAll & Deleting Elements
      - Syntax: document.querySelectorAll(".class"); element.remove();
      - In my own words: Grabs all the active circles on the page into a list, 
        then loops through them to delete each one when the button is clicked.
    */
    function clearScreen(event) {
      if (event) event.stopPropagation(); // Stops the document click listener from firing
      let circles = document.querySelectorAll(".circle");
      for (let i = 0; i < circles.length; i++) {
        circles[i].remove();
      }
    }

    /*
      CONCEPT: Mousemove Listener & Creating Elements
      - Syntax: target.addEventListener("event", function(event) { ... });
                document.createElement("tag");
                parent.appendChild(child);
      - In my own words: Every time the mouse moves, it makes a new div in JavaScript, 
        picks a random color and size, centers it on the cursor tip, and adds it to the page.
    */
    document.addEventListener("mousemove", function (event) {

      let circle = document.createElement("div");
      circle.className = "circle";

      /*
        CONCEPT: Random Color Picker
        - Syntax: array[Math.floor(Math.random() * array.length)]
        - In my own words: Math.random() gives a decimal, multiplying by the array length 
          and rounding down with Math.floor gives a valid index to pick a color.
      */
      let colors = [
        "hotpink",
        "cyan",
        "yellow",
        "purple",
        "orange",
        "lime"
      ];
      let randomColor = colors[Math.floor(Math.random() * colors.length)];
      circle.style.backgroundColor = randomColor;

      // Random size between 10px and 39px
      let size = Math.floor(Math.random() * 30) + 10;
      circle.style.width = size + "px";
      circle.style.height = size + "px";

      // Subtracting half the size centers the circle right over the cursor
      circle.style.left = (event.clientX - size / 2) + "px";
      circle.style.top = (event.clientY - size / 2) + "px";

      document.body.appendChild(circle);

      /*
        CONCEPT: setTimeout
        - Syntax: setTimeout(function() { ... }, milliseconds);
        - In my own words: Waits 1.5 seconds (1500ms) for the fade animation to finish, 
          then deletes the div so invisible circles don't lag the browser.
      */
      setTimeout(function () {
        circle.remove();
      }, 1500);

    });

    /*
      CONCEPT: Click Listener
      - Spawns a bigger white circle (60px) wherever the user clicks.
    */
    document.addEventListener("click", function (event) {

      // Don't spawn a circle if the user just clicked the Clear Screen button
      if (event.target.tagName === "BUTTON") return;

      let circle = document.createElement("div");
      circle.className = "circle bigCircle";
      circle.style.backgroundColor = "white";

      let size = 60;
      circle.style.width = size + "px";
      circle.style.height = size + "px";

      // Center the 60px circle on the click
      circle.style.left = (event.clientX - size / 2) + "px";
      circle.style.top = (event.clientY - size / 2) + "px";

      document.body.appendChild(circle);

      setTimeout(function () {
        circle.remove();
      }, 1500);

    });

  </script>
</body>
</html>
