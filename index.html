<!DOCTYPE html>
<html lang="en-US">

<head>
  <!--
    AI CITATION & DISCLOSURE
    - Tool: OpenAI ChatGPT
    - Initial Prompt: "Create an interactive HTML, CSS, and JavaScript page called Digital Bloom where moving the mouse leaves a trail of colorful fading circles, clicking spawns a larger white shape, and there is a button to clear the screen."
    - Student Note: Code reviewed, verified, and commented with generalized syntax and conceptual explanations by student for all DOM and CSS animation mechanics.
  -->
  <title>Digital Bloom</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden; /* Prevents scrollbars when circles expand near window edges */
    }

    h1 {
      margin-top: 20px;
    }

    p {
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      position: relative;
      z-index: 10; /* Keeps button clickable above dynamically spawned shapes */
    }

    /* 
      CONCEPT: Absolute Positioning & CSS Circle Shape
      - Generalized Syntax: 
          selector { position: absolute; border-radius: 50%; }
      - In my own words: 
          "position: absolute" removes the element from document flow, allowing coordinate-based 
          placement (left/top). "border-radius: 50%" rounds corners of a square box into a circle.
    */
    .circle {
      position: absolute;
      border-radius: 50%;

      /* 
        CONCEPT: Click-through Behavior
        - Generalized Syntax: pointer-events: none | auto;
        - In my own words: 
            Prevents the circle from catching mouse clicks, letting clicks pass through to whatever is underneath.
      */
      pointer-events: none;

      /* 
        CONCEPT: CSS Animation Trigger
        - Generalized Syntax: animation: <name> <duration> <timing-function>;
        - In my own words: Runs the @keyframes animation named "disappear" over 1.5 seconds.
      */
      animation: disappear 1.5s forwards;
    }

    /* 
      CONCEPT: CSS Keyframe Animation
      - Generalized Syntax:
          @keyframes <name> {
            from { <css-property>: <start-value>; }
            to   { <css-property>: <end-value>; }
          }
      - In my own words: 
          Transitions the circle from fully opaque (opacity: 1) and normal size (scale 1) 
          to transparent (opacity: 0) and 1.5x larger (scale 1.5).
    */
    @keyframes disappear {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(1.5);
      }
    }

    .bigCircle {
      border: 3px solid white;
    }
  </style>
</head>

<body>

  <h1>🌸 Digital Bloom 🌸</h1>

  <p>
    Move your mouse around the screen to create colorful shapes.
    Click to create a bigger shape!
  </p>

  <button onclick="clearScreen(event)">Clear Screen</button>

  <script>

    /*
      CONCEPT: DOM Querying & Batch Element Deletion
      - Generalized Syntax: 
          document.querySelectorAll("<css-selector>")
          element.remove()
      - In my own words: 
          querySelectorAll finds every element matching the selector and returns a list. 
          A loop iterates through that list to delete each circle from the DOM with .remove().
    */
    function clearScreen(event) {
      if (event) event.stopPropagation(); // Stops the document-wide click listener from firing
      let circles = document.querySelectorAll(".circle");
      for (let i = 0; i < circles.length; i++) {
        circles[i].remove();
      }
    }

    /*
      CONCEPT: Mouse Event Listener & Dynamic Element Injection
      - Generalized Syntax:
          target.addEventListener("<event>", function(eventObject) { ... })
          document.createElement("<tag>")
          parent.appendChild(child)
      - In my own words: 
          Fires on mouse motion. Creates a new <div> in memory, styles it with random dimensions 
          and colors, centers it at event.clientX/clientY, and appends it to document.body.
    */
    document.addEventListener("mousemove", function (event) {

      let circle = document.createElement("div");
      circle.className = "circle";

      /*
        CONCEPT: Pseudo-Random Selection
        - Generalized Syntax: array[Math.floor(Math.random() * array.length)]
        - In my own words: 
            Math.random() generates a decimal between 0 and 0.999; multiplying by array length 
            and flooring with Math.floor gives a valid random integer index.
      */
      let colors = [
        "hotpink",
        "cyan",
        "yellow",
        "purple",
        "orange",
        "lime"
      ];
      let randomColor = colors[Math.floor(Math.random() * colors.length)];
      circle.style.backgroundColor = randomColor;

      // Random diameter between 10px and 39px
      let size = Math.floor(Math.random() * 30) + 10;
      circle.style.width = size + "px";
      circle.style.height = size + "px";

      /*
        CONCEPT: Coordinate Centering Math
        - In my own words: 
            Subtracting half the width/height (size / 2) centers the circle directly on the cursor point.
      */
      circle.style.left = (event.clientX - size / 2) + "px";
      circle.style.top = (event.clientY - size / 2) + "px";

      document.body.appendChild(circle);

      /*
        CONCEPT: Asynchronous Memory Cleanup
        - Generalized Syntax: setTimeout(callbackFunction, delayInMilliseconds)
        - In my own words: 
            Waits 1500ms (until the CSS fade animation finishes) and deletes the invisible div from memory.
      */
      setTimeout(function () {
        circle.remove();
      }, 1500);

    });

    /*
      CONCEPT: Click Event Listener
      - Spawns a larger 60px white circle centered on the click point.
    */
    document.addEventListener("click", function (event) {

      // Don't spawn a circle if the user clicked the Clear Screen button
      if (event.target.tagName === "BUTTON") return;

      let circle = document.createElement("div");
      circle.className = "circle bigCircle";
      circle.style.backgroundColor = "white";

      let size = 60;
      circle.style.width = size + "px";
      circle.style.height = size + "px";

      circle.style.left = (event.clientX - size / 2) + "px";
      circle.style.top = (event.clientY - size / 2) + "px";

      document.body.appendChild(circle);

      setTimeout(function () {
        circle.remove();
      }, 1500);

    });

  </script>
</body>
</html>
