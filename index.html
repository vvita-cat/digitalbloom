<!DOCTYPE html>
<html lang="es-US">

<head>
  <title>Digital Bloom</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

     h1 {
      margin-top: 20px; }

    p {
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: disappear 1.5s;
    }

    @keyframes disappear {
      .from {
        opacity: 1;
        transform: scale(1);
      }
keyframes creates an animation. my animation makes the circles slowly disappear 
      .to {
        opacity: 0;
        transform: scale(1.5);
      }
    }

    .bigCircle {
      border: 3px solid white;
    }
  </style>
</head>

<body>

  <h1>🌸 Digital Bloom 🌸</h1>

  <p>
    Move your mouse around the screen to create colorful shapes.
    Click to create a bigger shape!
  </p>

  <script>

    // Create a shape when the mouse moves
    document.addEventListener("mousemove", function (event) {
tells the computer to watch for mouse movement
      let circle = document.createElement("div");

      circle.className = "circle";

      let colors = [
        "hotpink",
        "cyan",
        "yellow",
        "purple",
        "orange",
        "lime"
      ];

      let randomColor =
        colors[Math.floor(Math.random() * colors.length)];
randomly chooses one color from my list
      circle.style.backgroundColor = randomColor;

      let size = 10 + (event.clientY / window.innerHeight) * 30;

      circle.style.width = size + "px";
      circle.style.height = size + "px";

      circle.style.left = event.clientX - size / 2 + "px";
      circle.style.top = event.clientY - size / 2 + "px";
tells the computer the horizontal and vertical position of the mouse
use the mouses X and Y positoins the place the circle on the screen
      document.body.appendChild(circle);
adds a new circle to the webpage so the person can see it 
      // Remove the circle after 1.5 seconds
      setTimeout(function () {
     it waits 1.5 seconds and then removes rhe circle
        circle.remove();
      }, 1500);

    });


    // Create a bigger circle when the user clicks
    document.addEventListener("click", function (event) {
tells the computer to watch for a click. when the user clicks it it creates another circle
      let circle = document.createElement("div");
it creates a new html div that i use as my circle
      circle.className = "circle bigCircle";

      circle.style.backgroundColor = "white";

      circle.style.width = "60px";
      circle.style.height = "60px";

      circle.style.left = event.clientX - 30 + "px";
      circle.style.top = event.clientY - 30 + "px";

      document.body.appendChild(circle);
puts it on the page
      setTimeout(function () {
        circle.remove();
      }, 1500);

    });

</script>
</body>
</html>
